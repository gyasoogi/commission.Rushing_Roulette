<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>VIP ROULETTE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body oncontextmenu="return false" ondragstart="return false" onselectstart="return false">

    <div id="login-screen" class="min-h-screen bg-[#030303] noise-bg flex flex-col items-center justify-center p-4 relative overflow-hidden">
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[50rem] h-[50rem] bg-gradient-to-tr from-red-900/5 to-amber-900/5 rounded-full blur-[100px] pointer-events-none"></div>
        
        <div class="relative z-10 w-full max-w-sm bg-[#0a0a0c]/80 backdrop-blur-3xl border border-white/20 rounded-2xl p-12 shadow-[0_20px_60px_rgba(0,0,0,0.8)]">
            <div class="text-center mb-10">
                <h2 class="text-[#d43737] text-[9px] tracking-[0.4em] font-light mb-4 uppercase opacity-70">VIP Lounge</h2>
                <h1 class="text-3xl font-light tracking-[0.2em] text-white">ROULETTE</h1>
            </div>
            
            <div class="space-y-8">
                <div class="relative">
                    <input type="text" id="nickname-input" maxlength="10" placeholder="ENTER NICKNAME" class="w-full bg-white/[0.03] border border-white/10 rounded-lg text-white px-4 py-3.5 outline-none focus:border-[#9e9e9e]/50 focus:bg-white/[0.05] transition-all text-center text-sm font-light tracking-widest placeholder-white/20 shadow-inner" />
                </div>
                
                <div class="flex flex-col gap-3">
                    <button onclick="handleJoin('player')" class="w-full bg-white text-black hover:bg-gray-200 font-semibold py-3.5 rounded-lg transition-all tracking-[0.15em] text-xs uppercase shadow-[0_0_15px_rgba(255,255,255,0.1)]">Join Game</button>
                    <button onclick="handleJoin('spectator')" class="w-full bg-transparent border border-white/25 hover:bg-white/10 text-gray-300 font-light py-3 rounded-lg transition-all tracking-[0.15em] uppercase text-xs">Spectate</button>
                </div>
            </div>
        </div>
    </div>

    <div id="game-screen" class="hidden h-[100dvh] w-full relative overflow-hidden bg-[#030303] noise-bg">
        <div class="fixed inset-0 bg-[radial-gradient(circle_at_center,_#0a0808_0%,_#030303_100%)] pointer-events-none"></div>

        <header class="absolute top-[clamp(10px,1.8vh,24px)] left-[clamp(10px,1.5vw,24px)] right-[clamp(10px,1.5vw,24px)] z-50 flex justify-between items-start gap-[clamp(8px,1vw,18px)] pointer-events-none">
            <div class="w-[clamp(200px,20vw,280px)] min-w-0 bg-[#0a0a0c]/80 backdrop-blur-2xl border border-white/[0.05] rounded-[clamp(14px,1.6vw,28px)] p-[clamp(10px,1vw,20px)] shadow-2xl pointer-events-auto relative flex flex-col h-auto max-h-[34vh] overflow-hidden ml-[10px] mt-[10px]">
                <div class="flex items-center justify-between mb-3">
                    <span class="text-white/40 text-[10px] font-light tracking-[0.3em] uppercase">Roster</span>
                    <button id="toggle-player-list" class="text-[9px] text-white/40 hover:text-white transition-all tracking-[0.2em] uppercase">∨</button>
                </div>
                
                <ul id="player-list" class="flex-1 min-h-0 overflow-hidden pr-1 text-[clamp(11px,0.8vw,16px)] flex flex-col gap-[clamp(4px,0.4vw,8px)]"></ul>
                
                <div class="mt-4 pt-4 border-t border-white/10">
                    <div class="flex items-center justify-between mb-2">
                        <span class="text-white/40 text-[10px] font-light tracking-[0.3em] uppercase flex items-center gap-2">
                            Spectators <span id="spectator-count" class="bg-white/10 px-1.5 py-0.5 rounded text-white/80">0</span>
                        </span>
                        <button id="toggle-spectator-list" class="text-[9px] text-white/40 hover:text-white transition-all tracking-[0.2em] uppercase">∧</button>
                    </div>
                    <ul id="spectator-list" class="hidden overflow-hidden pr-1 text-[clamp(8px,0.62vw,12px)] flex-col gap-[clamp(2px,0.3vw,6px)]"></ul>
                </div>
            </div>

            <div class="fixed md:relative bottom-[max(18px,env(safe-area-inset-bottom))] left-1/2 -translate-x-1/2 md:translate-x-0 md:left-auto md:bottom-auto bg-[#0a0a0c]/80 backdrop-blur-2xl border border-white/[0.05] rounded-full px-[clamp(12px,1.2vw,24px)] py-[clamp(8px,0.8vw,14px)] flex items-center gap-[clamp(4px,0.5vw,12px)] pointer-events-auto shadow-2xl h-fit z-50">
                <span class="text-[#9e9e9e] text-[10px] uppercase tracking-[0.2em] font-light mr-2">CHAMBERS</span>
                <div id="bullet-indicator" class="flex items-center gap-2"></div>
            </div>
        </header>

        <main class="relative z-10 w-full h-full flex flex-col items-center justify-center p-4 overflow-hidden">
            <div class="w-full flex flex-col items-center translate-y-[7vh]">
                <div id="status-container" class="min-h-[4rem] flex items-center justify-center text-center px-4 w-full mb-4"></div>
                <div class="relative w-[45vmin] h-[45vmin] max-w-[320px] max-h-[320px] flex items-center justify-center transition-all duration-700 shrink-0">
                    <div class="absolute inset-0 bg-white/[0.02] rounded-full blur-2xl mix-blend-screen pointer-events-none"></div>
                    <img id="gun-image" src="assets/images/cylinder.png" alt="Gun" class="w-full h-full object-contain drop-shadow-[0_0_20px_rgba(0,0,0,0.9)]">
                    <img id="aiming-image" src="assets/images/aim.png" class="absolute w-[120%] h-[120%] object-contain opacity-0 pointer-events-none transition-opacity duration-700">
                </div>
                <div id="control-area" class="min-h-[6rem] flex items-center justify-center w-full px-6 mt-4 pointer-events-auto"></div>
            </div>
        </main>

        <div id="system-controls" class="absolute bottom-6 right-6 z-50 pointer-events-auto"></div>

        <div id="death-overlay" class="hidden fixed inset-0 z-[100] flex flex-col items-center justify-center pointer-events-none bg-[#030303]/95 backdrop-blur-sm">
            <div id="blood-splatter" class="absolute inset-0 overflow-hidden mix-blend-multiply opacity-60"></div>
            <div id="eliminated-text-container" class="relative z-10 flex flex-col items-center hidden">
                <div class="w-20 h-[1px] bg-red-600/50 mb-6"></div>
                <h1 id="eliminated-text" class="text-[5.5rem] font-light text-red-600 tracking-[0.2em] uppercase mb-2" style="text-shadow:0 0 40px rgba(220,38,38,0.3);">GOOD BYE</h1>
                <h2 id="custom-death-text" class="text-2xl font-bold text-red-500 tracking-widest mt-2 uppercase text-center" style="text-shadow:0 0 20px rgba(220,38,38,0.5);"></h2>
                <div class="w-20 h-[1px] bg-red-600/50 mt-6"></div>
            </div>
        </div>

        <div id="death-announcement" class="fixed top-[12vh] left-1/2 -translate-x-1/2 z-[200] px-6 py-3 rounded-xl bg-red-950/70 border border-red-500/30 backdrop-blur-xl text-white tracking-[0.15em] text-sm uppercase opacity-0 pointer-events-none transition-all duration-500"></div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
